<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 노트북 관리 시스템</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); padding: 30px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"], input[type="number"] { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        .result-card { background: #f1f5f9; padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #475569; }
        .form-group input { width: 100%; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-update { background: #10b981; flex: 1; }
        .btn-update:hover { background: #059669; }
        .hidden { display: none; }
        .loading { text-align: center; color: #64748b; font-style: italic; margin: 10px 0; }
        .status-msg { text-align: center; font-weight: bold; margin-top: 15px; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏫 학교 노트북 관리 시스템</h2>
    
    <!-- 검색 영역 -->
    <div class="search-box">
        <input type="text" id="search-name" placeholder="사용자 이름을 입력하세요 (예: 홍길동)">
        <button onclick="searchNotebook()">검색</button>
    </div>

    <div id="loading" class="loading hidden">데이터를 처리 중입니다...</div>
    <div id="status-msg" class="status-msg hidden"></div>

    <!-- 결과 및 수정 영역 -->
    <div id="result-area" class="result-card hidden">
        <div class="form-group">
            <label for="notebook-user">사용자 이름</label>
            <input type="text" id="notebook-user" readonly style="background-color: #e2e8f0; color: #64748b;">
        </div>
        <div class="form-group">
            <label for="notebook-model">노트북 모델명</label>
            <input type="text" id="notebook-model" placeholder="모델명을 입력하세요">
        </div>
        <div class="form-group">
            <label for="notebook-year">구입 년도</label>
            <input type="number" id="notebook-year" placeholder="예: 2024">
        </div>
        <div class="form-group">
            <label for="notebook-ip">IP 주소</label>
            <input type="text" id="notebook-ip" placeholder="예: 192.168.0.10">
        </div>
        
        <div class="btn-group">
            <button class="btn-update" onclick="updateNotebook()">정보 저장/수정하기</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ 중요: 구글 앱스 스크립트 배포 후 얻은 웹 앱 URL을 여기에 붙여넣어주세요.
    const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    function toggleLoading(show) {
        document.getElementById('loading').classList.toggle('hidden', !show);
    }
    
    function showMessage(msg, isSuccess) {
        const msgEl = document.getElementById('status-msg');
        msgEl.innerText = msg;
        msgEl.className = "status-msg " + (isSuccess ? "success" : "error");
        msgEl.classList.remove('hidden');
    }
    
    function clearMessage() {
        document.getElementById('status-msg').classList.add('hidden');
    }

    // 1. 사용자 이름으로 노트북 정보 검색
    function searchNotebook() {
        const name = document.getElementById('search-name').value.trim();
        if (!name) { alert("조회할 사용자 이름을 입력해주세요."); return; }

        toggleLoading(true);
        clearMessage();
        document.getElementById('result-area').classList.add('hidden');

        fetch(`${scriptURL}?action=search&name=${encodeURIComponent(name)}`)
        .then(res => res.json())
        .then(response => {
            toggleLoading(false);
            if (response.result === "success") {
                document.getElementById('notebook-user').value = response.data.user;
                document.getElementById('notebook-model').value = response.data.model;
                document.getElementById('notebook-year').value = response.data.year;
                document.getElementById('notebook-ip').value = response.data.ip;
                
                document.getElementById('result-area').classList.remove('hidden');
            } else {
                if (confirm("등록되지 않은 사용자입니다. 새로운 장비 정보로 등록하시겠습니까?")) {
                    document.getElementById('notebook-user').value = name;
                    document.getElementById('notebook-model').value = "";
                    document.getElementById('notebook-year').value = "";
                    document.getElementById('notebook-ip').value = "";
                    document.getElementById('result-area').classList.remove('hidden');
                }
            }
        })
        .catch(err => {
            toggleLoading(false);
            showMessage("서ver 통신 오류가 발생했습니다. 앱스 스크립트 URL 설정을 확인하세요.", false);
        });
    }

    // 2. 노트북 데이터 수정 및 신규 저장 신청
    function updateNotebook() {
        const user = document.getElementById('notebook-user').value;
        const model = document.getElementById('notebook-model').value.trim();
        const year = document.getElementById('notebook-year').value.trim();
        const ip = document.getElementById('notebook-ip').value.trim();

        if (!model || !year || !ip) { alert("모든 데이터를 정상적으로 입력해주세요."); return; }

        toggleLoading(true);
        clearMessage();

        const data = {
            action: "update",
            user: user,
            model: model,
            year: year,
            ip: ip
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            toggleLoading(false);
            showMessage("노트북 정보가 구글 스프레드시트에 성공적으로 기록되었습니다.", true);
        })
        .catch(err => {
            toggleLoading(false);
            showMessage("데이터 저장 작업에 실패했습니다.", false);
        });
    }
</script>
</body>
</html>
